project_id = "lethub"

# verify_jwt must match what is deployed. Functions marked false check the
# caller themselves (supabase.auth.getUser) or are public by design (Stripe
# webhook, website lead form, email-confirmation redirect, invite acceptance).
# Note: verify_jwt = true only proves a valid JWT, and the public anon key is
# one, so every function that changes data must also check the user itself.

[functions.accept-agency-invite]
verify_jwt = false

[functions.accept-portal-invite]
verify_jwt = false

[functions.api-security-admin]
verify_jwt = true

[functions.check-secrets]
verify_jwt = true

